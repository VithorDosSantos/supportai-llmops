[project]
name = "supportai"
version = "0.1.0"
description = "Plataforma de atendimento ao cliente com triagem por ML, RAG avaliado e LLMOps."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
# Dependências entram por fase: só o que já é usado. Bibliotecas pesadas
# (torch, sentence-transformers, mlflow) chegam na fase que precisa delas,
# mantendo o CI rápido e cada dependência justificada.
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/supportai"]

# --- Ruff ---------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear: bugs comuns
    "UP",       # pyupgrade: sintaxe moderna
    "SIM",      # simplificações
    "N",        # nomes PEP 8
    "RUF",      # regras do próprio ruff
    "PT",       # boas práticas de pytest
]

# --- Mypy ---------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true

# --- Pytest -------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: testes que dependem de serviços externos (ex.: Postgres)",
]

[tool.coverage.run]
source = ["src/supportai"]
