[project]
name = "supportai"
version = "0.1.0"
description = "Plataforma de atendimento ao cliente com triagem por ML, RAG avaliado e LLMOps."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
# Dependências entram por fase: só o que já é usado. Bibliotecas pesadas
# (torch, sentence-transformers, mlflow) chegam na fase que precisa delas,
# mantendo o CI rápido e cada dependência justificada.
dependencies = [
    "fastapi>=0.115",
    "huggingface-hub>=0.26",
    "matplotlib>=3.9",
    "mlflow>=3.0",
    "pandas>=2.2",
    "pandera[pandas]>=0.22",
    "prometheus-client>=0.21",
    "psycopg[binary]>=3.2",
    "pyarrow>=18.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "scikit-learn>=1.5",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "dvc>=3.55",
    "httpx>=0.28",
    "mypy>=1.13",
    "pandas-stubs>=3.0.5.260914",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/supportai"]

# --- Ruff ---------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear: bugs comuns
    "UP",       # pyupgrade: sintaxe moderna
    "SIM",      # simplificações
    "N",        # nomes PEP 8
    "RUF",      # regras do próprio ruff
    "PT",       # boas práticas de pytest
]

# --- Mypy ---------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

# Bibliotecas sem type hints (ou opcionais, ausentes no CI). `follow_imports =
# "skip"` faz o mypy tratá-las como Any com ou sem o extra instalado, para que
# o resultado seja o mesmo na máquina local e no CI.
[[tool.mypy.overrides]]
module = ["sentence_transformers.*", "torch.*", "sklearn.*", "scipy.*", "mlflow.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true

# --- Pytest -------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: testes que dependem de serviços externos (ex.: Postgres)",
]

[tool.coverage.run]
source = ["src/supportai"]
