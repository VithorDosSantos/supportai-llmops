# Ruff e mypy rodam como hooks locais via `uv run`: usam as mesmas versões
# do uv.lock que o CI, evitando divergência entre a máquina e o pipeline.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # dvc.lock é gerado pelo DVC: "corrigi-lo" só cria churn a cada `dvc repro`.
      - id: trailing-whitespace
        exclude: ^dvc\.lock$
      - id: end-of-file-fixer
        exclude: ^dvc\.lock$
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=1000"]  # dados grandes vão para o DVC
        exclude: ^uv\.lock$     # o lockfile não é dado e precisa estar no git
      - id: detect-private-key

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
