# Infra local. Serviços novos (MLflow, Langfuse) entram nas fases seguintes.
services:
  db:
    # Imagem oficial do pgvector: Postgres 16 com a extensão já compilada.
    image: pgvector/pgvector:pg16
    container_name: supportai-db
    environment:
      POSTGRES_USER: ${DB_USER:-supportai}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-supportai}
      POSTGRES_DB: ${DB_NAME:-supportai}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Scripts aqui rodam só na primeira inicialização (volume vazio).
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    # Modelos montados do host (gere com `uv run python -m supportai.classifier.export`).
    build:
      context: .
      target: runtime
    container_name: supportai-api
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models:ro
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    profiles: ["api"]

volumes:
  pgdata:
