name: CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, tipos e testes
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: supportai
          POSTGRES_PASSWORD: supportai
          POSTGRES_DB: supportai
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U supportai"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Instalar dependências
        # --locked: falha se o uv.lock estiver desatualizado em relação ao pyproject.
        run: uv sync --locked

      - name: Ruff (lint)
        run: uv run ruff check --output-format=github .

      - name: Ruff (format)
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy

      - name: Habilitar pgvector
        # Service containers não montam o init do compose; criamos a extensão aqui.
        run: |
          uv run python -c "import psycopg; psycopg.connect('postgresql://supportai:supportai@localhost:5432/supportai', autocommit=True).execute('CREATE EXTENSION IF NOT EXISTS vector')"

      - name: Pytest
        run: uv run pytest --cov --cov-report=term-missing

  docker:
    name: Imagem Docker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build (target runtime)
        # O alvo com modelos embutidos depende de `models/` exportado do
        # registry local, que não existe no CI; o runtime valida o resto.
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          tags: supportai-api:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run --rm supportai-api:ci python -c "from supportai.api.main import create_app; print('import ok')"
          docker run --rm supportai-api:ci id -u | grep -qx 10001

      - name: Tamanho da imagem
        run: |
          size=$(docker image inspect supportai-api:ci --format '{{.Size}}')
          echo "Imagem runtime: $((size / 1024 / 1024)) MB" | tee -a "$GITHUB_STEP_SUMMARY"
